name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Dependency updates can change the compiled TUI. On Renovate branches, rebuild dist/ and commit it.
  # GitHub holds the PR run for a bot push as "action_required", so approve it to check the new commit.
  dist:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run compile
      - id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- dist; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "chore: rebuild dist"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          sha=$(git rev-parse HEAD)
          for _ in $(seq 30); do
            sleep 10
            run=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$sha&event=pull_request&status=action_required" -q '.workflow_runs[0].id // empty')
            if [ -n "$run" ]; then
              gh api -X POST "repos/${{ github.repository }}/actions/runs/$run/approve"
              exit 0
            fi
          done
          echo "::warning::No run to approve for $sha; approve it in the Actions tab"

  check:
    needs: dist
    # Runs when dist needed no commit; after a dist commit, the dispatched run checks the new head instead.
    if: always() && needs.dist.outputs.pushed != 'true' && (needs.dist.result == 'success' || needs.dist.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run compile
      - name: dist is up to date
        run: git diff --exit-code dist
      - run: bun run check:dist
      - run: bun test
